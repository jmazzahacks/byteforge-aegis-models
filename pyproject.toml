[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "byteforge-aegis-models"
version = "2.1.0"
description = "Shared models for ByteForge Aegis multi-tenant authentication service"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Jason Byteforge", email = "jason@mzmail.me" },
]
keywords = ["byteforge", "aegis", "auth", "authentication", "multi-tenant", "models"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Repository = "https://github.com/jmazzahacks/byteforge-aegis-models"

[tool.hatch.build.targets.wheel]
packages = ["src/byteforge_aegis_models"]
